# Web Profile 配置模板
# 用途：
# - 填充后可直接作为 Web 端配置导入的 `config_path`
# - 导入入口：`POST /api/ui/v1/profiles/import`
# - 导入后会生成正式 Profile，并自动创建 snapshot
#
# 约定：
# - 敏感信息优先使用环境变量占位，如 `${DATABASE_URL}`、`${TGB_COOKIE}`、`${KAIPAN_TOKEN}`
# - 配置加载支持环境变量展开；未替换前请勿当作生产配置直接使用

database:
  # 连接串建议由环境变量注入；例如：
  # postgresql+asyncpg://user:pass@localhost:5432/trade_strategy_ai
  url: ${DATABASE_URL}
  echo: false
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 1800

timezone: Asia/Shanghai

# 运行模式：interactive（本地/手动） / service（长期运行服务）
run_mode: interactive

# 顶层基准标的，用于默认推断和展示
market_state_benchmark_symbol: "510300.SH"

schedule:
  enable: false
  pre_market_time: "08:30"
  after_close_time: "15:30"

evaluation:
  min_expected_return: 0.0
  loss_trigger: true
  trade_constraint:
    t_plus_one: true
    limit_up_pct: null
    limit_down_pct: null
    board_type: "auto"

data:
  # demo / 本地验证可保留 mock；接入真实行情时可改为 akshare / tushare 等
  providers: ["mock"]
  mock_prices:
    000001.SZ: 10.0
    510300.SH: 3.5
  market_universe_snapshot_dir: data/market_universe/snapshots

data_quality:
  trade:
    fee_high_threshold: 0.01
  anomaly:
    iqr_multiplier: 1.5
    volume_spike_multiplier: 5.0

dashboard:
  alerts:
    enabled: true
    freshness_threshold_hours: 24
    anomaly_rate_threshold: 5.0
  html_output_dir: data/processed/dashboard
  max_anomaly_details: 20
  alert_mode: both

crawl:
  auth:
    tgb.cn:
      mode: cookie
      cookie: ${TGB_COOKIE}

  sources:
    - source: tgb
      site: tgb.cn
      trader_id: javxsp
      author_id: "10461311"
      author_name: javxsp
      list_url: https://www.tgb.cn/user/blog/moreTopic
      enabled: true
      render_js: false

  throttling:
    min_interval_seconds: 1.0
    max_interval_seconds: 5.0
    backoff_seconds: [5, 15, 30]

storage:
  output_dir: data/processed/phase0

llm:
  provider: "qwen"
  model: ["qwen3-8b"]
  url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: ${DASHSCOPE_API_KEY}

persona:
  enable: true
  objective: "return_max"
  clusters_path: data/processed/persona/clusters.sample.json
  top_k: 2
  market_state_path: null
  market_state_benchmark_symbol: "510300.SH"
  market_state_benchmark_csv: null

# Stage 4 盘前链路开关
stage4:
  # 是否启用新版盘前链路
  enable: true
  # 候选池快照时段
  market_universe_slot: "09-25"
  # 不可用时是否降级到 Phase 0
  allow_phase0_fallback: true

traders:
  - trader_id: trader_a
    display_name: Trader A
    article_sources:
      urls: []
      rss: []
      site_type: null
      crawl_frequency_minutes: null
    trade_log_sources:
      csv_paths: []
    watchlist: ["000001.SZ", "510300.SH"]
    default_target_pct: 0.05
    default_stop_pct: 0.03

api:
  host: "0.0.0.0"
  port: 8000
  timeout_seconds: 300
  auth:
    enabled: false
    api_keys: []

kaipan:
  data_dir: data/kaipan
  schema_dir: src/providers/kaipan_schema
  token: ${KAIPAN_TOKEN}
  user_id: ${KAIPAN_USER_ID}
  default_headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    User-Agent: Dalvik/2.1.0 (Linux; U; Android 9; SHARK PRS-A0 Build/PQ3A.190605.01141736)
    Connection: Keep-Alive
    Accept-Encoding: gzip
  fetch_schedule:
    pre_market: "9:25"
    post_close: "17:30"
  trading_calendar:
    source: akshare
  min_request_interval_seconds: 1.0
  max_retries: 3
  retry_backoff_seconds: [1.0, 2.0, 4.0]
  retry_status_codes: [403, 429, 500, 502, 503, 504]

akshare:
  min_request_interval_seconds: 1.0
  max_retries: 2
  retry_backoff_seconds: [1.0, 3.0]
  fallback_enabled: true

alerting:
  enabled: true
  channel: "dingtalk"
  aggregation:
    window_minutes: 60
    max_count: 100
  dingtalk:
    webhook_url: ${DINGTALK_WEBHOOK_URL}
    secret: ${DINGTALK_SECRET}
  feishu:
    webhook_url: ${FEISHU_WEBHOOK_URL}
  wecom:
    webhook_url: ${WECOM_WEBHOOK_URL}
  min_level: "WARNING"
  console_output: true
