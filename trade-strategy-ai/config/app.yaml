## trade-strategy-ai 配置文件（YAML）
## - 配置加载支持环境变量展开：例如 "${TGB_COOKIE}"（见 src/common/config.py:_expand_env_vars）
## - 建议不要把 Cookie/API Key 明文写入仓库，优先用环境变量注入

# 数据库（推荐：本机安装 PostgreSQL；Docker 仅作为可选方案）
database:
  # SQLAlchemy Async URL（示例：postgresql+asyncpg://user:pass@localhost:5432/trade_strategy_ai）
  # 若不填写（null），则使用 .env / 环境变量中的 DATABASE_URL（或 Settings 默认值）。
  url: null
  echo: false
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 1800

# 时区（影响“盘前/盘后”调度的本地时间解析）
timezone: Asia/Shanghai

# 运行模式：interactive（手动/本地验证） / service（长期运行服务，后续可扩展）
run_mode: interactive

schedule:
  # 是否启用定时调度（Phase 0 默认 false，仅手动跑）
  enable: false
  # 盘前时间（HH:MM，按 timezone 解释）
  pre_market_time: "08:30"
  # 盘后时间（HH:MM，按 timezone 解释）
  after_close_time: "15:30"

evaluation:
  # 收益率不达标阈值（如 0.01 表示 1%）
  min_expected_return: 0.0
  # 是否“亏损即触发复盘”
  loss_trigger: true
  # A股交易规则约束
  trade_constraint:
    # 是否启用 T+1 约束（买入当日不能卖出）
    t_plus_one: true
    # 涨停幅度比例（null 表示按板块类型自动推断：主板 10%，创业板/科创板 20%，ST 5%）
    limit_up_pct: null
    # 跌停幅度比例（null 表示按板块类型自动推断）
    limit_down_pct: null
    # 板块类型：auto（自动推断）/ main（主板 10%）/ chinext（创业板 20%）/ star（科创板 20%）/ st（ST 5%）/ bse（北交所 30%）
    board_type: "auto"

strategy:
  # 策略执行配置；保持与 app.template.yaml 同结构，方便 Profile 导入和 CLI 调试。
  feature_engine:
    # realtime：运行时实时计算；precomputed：使用预计算结果。
    mode: "realtime"
    # true：批量计算；false：单条处理。
    compute_batch: true
  rule_evaluator:
    dsl_executor:
      # all / first / best：规则执行策略。
      mode: "all"
      # 单条规则超时（毫秒）。
      timeout_ms: 100
  signal_synthesizer:
    # priority / weighted_score / voting：信号合成策略。
    mode: "priority"
    # 数值越大影响越强，通常 0.0 ~ 5.0。
    weights:
      entry: 1.0
      exit: 1.2
      filter: 1.5
      sizing: 1.0
      risk: 2.0
    # 从高到低的合成优先级。
    priorities:
      - risk
      - filter
      - exit
      - sizing
      - entry

risk:
  # 风控执行配置；与 app.template.yaml 保持一致。
  position_manager:
    # fixed_amount / fixed_ratio / volatility_adjusted。
    mode: "fixed_ratio"
    # 固定金额模式的基准金额（元）。
    fixed_amount: 10_000.0
    # 固定比例模式下的仓位占比（建议 0.01 ~ 0.20）。
    fixed_ratio_pct: 0.05
    # 目标波动率（建议 0.05 ~ 0.30）。
    target_volatility: 0.15
    # 单笔仓位占净值上限（建议不超过 0.20）。
    max_position_pct: 0.20
    # 单笔绝对金额上限（元）。
    max_single_position: 50_000.0
  stop_loss:
    # fixed / volatility / trailing / time。
    mode: "volatility"
    # 固定止损比例（例如 0.05 = 5%）。
    fixed_pct: 0.05
    # 波动率止损倍数（常见 1.5 ~ 3.0）。
    atr_multiplier: 2.0
    # ATR 窗口（交易日）。
    atr_window: 14
    # 最大回撤比例。
    drawdown_pct: 0.10
    # 最大持有天数。
    max_hold_days: 10
  take_profit:
    # fixed / scaling / trailing / time。
    mode: "scaling"
    # 固定止盈比例。
    fixed_pct: 0.15
    # 分批止盈档位；close_pct 为该档位卖出比例。
    scaling_levels:
      - target_pct: 0.05
        close_pct: 0.50
      - target_pct: 0.10
        close_pct: 0.30
      - target_pct: 0.20
        close_pct: 0.20
    # 跟踪止盈回撤比例。
    trailing_pct: 0.05
    # 目标持有天数。
    target_hold_days: 5
  simulated_account:
    # 是否保存模拟账户结果。
    enabled: true
    # 初始资金（元）。
    initial_capital: 100_000.0
    # 是否落库，便于回放与审计。
    persist_to_db: true
  concentration:
    # 单股仓位占净值上限。
    max_single_position_pct: 0.20
    # 单股绝对金额上限（元）。
    max_single_position_amount: 50_000.0
  industry:
    # 单行业最大占比。
    max_industry_pct: 0.30
    # 单一级行业最大占比。
    max_sector_pct: 0.40
    # 缓存时长（小时）。
    cache_ttl_hours: 24
  portfolio:
    # VaR 置信度。
    var_confidence: 0.95
    # VaR 计算窗口（交易日）。
    var_window: 20
    # 最大 VaR 占比。
    max_var_pct: 0.10
    # 最大波动率。
    max_volatility: 0.30
    # 最大杠杆率，1.0 表示不加杠杆。
    max_leverage: 1.0

data:
  # 数据提供者列表：Phase 0 默认 mock；后续可扩展为 akshare/tushare 等
  providers: ["mock"]
  # mock_prices 用于演示闭环，后续可接入 akshare/tushare 等
  mock_prices:
    000001.SZ: 10.0
    510300.SH: 3.5
  # 候选池快照存储目录
  market_universe_snapshot_dir: data/market_universe/snapshots

# 数据质量配置
data_quality:
  trade:
    # 交易费率阈值：超过此比例就会被标记为高费率。
    # 调小：更多交易会被判定为高费率，适合更严格地排查手续费异常或数据质量问题。
    # 调大：只有特别高的费率才会被标记，误报更少，但也更容易漏掉边缘异常。
    # 常用默认值：0.01，表示 1%。
    fee_high_threshold: 0.01
  anomaly:
    # 价格异常检测的 IQR 倍数。
    # 调小建议：1.0 ~ 1.2，更敏感，适合更严格地排查异常波动，但误报会变多。
    # 调大建议：2.0 ~ 3.0，更宽松，适合减少误报，但也更容易漏掉边缘异常。
    iqr_multiplier: 1.5
    # 成交量 spike 阈值倍数。
    # 调小建议：2.0 ~ 3.0，更容易把放量标记为异常，适合更敏感的监控。
    # 调大建议：5.0 ~ 8.0，只会捕获特别夸张的放量，噪声更少但也更容易漏掉早期信号。
    volume_spike_multiplier: 5.0

# 数据监控 Dashboard
dashboard:
  alerts:
    # 是否启用告警
    enabled: true
    # 数据新鲜度阈值（小时），超过则告警
    freshness_threshold_hours: 24
    # 异常率阈值（%），超过则告警
    anomaly_rate_threshold: 5.0
  # HTML 输出目录
  html_output_dir: data/processed/dashboard
  # 最大显示异常详情数
  max_anomaly_details: 20
  # 告警输出模式：cli / html / both
  alert_mode: both

crawl:
  # 站点认证信息（按域名/站点名分组）
  auth:
    tgb.cn:
      # 认证模式：目前首版为 cookie；后续可扩展 playwright_login 等
      mode: cookie
      # 淘股吧 Cookie（建议通过环境变量注入）
      cookie: "${TGB_COOKIE}"

  # 抓取来源列表（支持同站点多作者增量抓取）
  sources:
    - source: tgb
      site: tgb.cn
      trader_id: javxsp
      # 作者 ID（站点内唯一标识）
      author_id: "10461311"
      # 作者展示名（用于标记”作者/读者”评论身份）
      author_name: javxsp
      # 列表页 URL（用于遍历文章；分页参数 ?pageNo=N&sortFlag=T&userID=xxx 由代码拼接）
      list_url: https://www.tgb.cn/user/blog/moreTopic
    # - source: tgb
    #   site: tgb.cn
    #   author_id: 10461311
    #   author_name: javxsp
    #   list_url: https://www.tgb.cn/user/blog/moreTopic?userID=10461311
  throttling:
    # 每次请求之间的随机间隔区间（秒）
    min_interval_seconds: 1.0
    max_interval_seconds: 5.0
    # 触发 403/429/非登录态等失败时的退避序列（秒），按序重试
    backoff_seconds: [5, 15, 30]

runtime:
  # 输出目录（Phase 0/0.5 日报、persona_route 等产物默认写到这里）
  output_dir: data/processed/phase0

pre_market_formal_flow:
  # 是否启用盘前正式主链路
  enabled: true
  # 候选池快照时段
  market_universe_slot: "09-25"

llm:
  # 大模型提供商（预留）：openai/anthropic/...
  provider: "qwen"
  # 模型名（例如 gpt-4.1 / claude-3-... 等；取决于 provider）
  model: ["qwen3-8b"] #["qwen-plus-0112"]
  # 第三方大模型 API Base URL（可选）。例如 OpenAI 兼容接口可配置为 https://api.openai.com/v1
  url: "https://ws-4eru7sgi4t75umeo.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  # 大模型 API Key（建议通过环境变量 DASHSCOPE_API_KEY 注入；此处仅占位）
  api_key: null

persona:
  # 是否启用 Persona Router（启用后会给 TradeIdea 标注 style_cluster，并输出 persona_route JSON）
  enable: true
  # 路由目标：return_max（收益最大化）；后续可扩展 risk_min
  objective: "return_max"
  # clusters 文件路径（样例文件可用 cli persona-init-sample 生成；后续可替换为真实抽取聚类产物）
  clusters_path: data/processed/persona/clusters.sample.json
  # 输出 Top-K（当前默认 2：Top-1 + Top-2 备选）
  top_k: 2
  # 可选：直接指定 MarketState JSON（不指定时可从 benchmark CSV 构建）
  market_state_path: null
  # 基准指数/ETF：用于从日线推断 MarketState（regime/vol）
  market_state_benchmark_symbol: "510300.SH"
  # 基准日线 CSV（列：date,close...）；为空时可用 cli market-state-build --from-akshare 拉取
  market_state_benchmark_csv: null

traders:
  - trader_id: trader_a
    # 展示名（用于报告展示）
    display_name: Trader A
    article_sources:
      # 文章来源（预留）：目前抓取主入口在 crawl.sources（按作者配置）；这里用于后续“交易员画像/增量刷新”映射
      urls: []
      rss: []
      site_type: null
      crawl_frequency_minutes: null
    trade_log_sources:
      # 交易记录来源（预留）：后续支持 CSV/Excel/PDF 等导入
      csv_paths: []
    # 默认止盈/止损（当 TraderAgent 未给出时使用）
    default_target_pct: 0.05
    default_stop_pct: 0.03

# API 服务配置
api:
  host: "0.0.0.0"
  port: 8000
  timeout_seconds: 300  # 5分钟，0 表示不限制
  auth:
    enabled: false
    api_keys:
      []

# Kaipan 开盘啦私有接口配置
kaipan:
  # 数据存储根目录
  data_dir: data/kaipan
  # Schema 文件目录
  schema_dir: src/providers/kaipan_schema
  # 可选鉴权参数（建议通过环境变量注入）
  token: null
  user_id: null
  # 默认请求头，模拟 Android 客户端
  default_headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    User-Agent: Dalvik/2.1.0 (Linux; U; Android 9; SHARK PRS-A0 Build/PQ3A.190605.01141736)
    Connection: Keep-Alive
    Accept-Encoding: gzip
  # 抓取时间表（可配置）
  fetch_schedule:
    pre_market: "9:25"    # 盘前
    post_close: "17:30"  # 盘后
  # 交易日历来源
  trading_calendar:
    source: akshare
  # 简单反爬与重试策略
  min_request_interval_seconds: 1.0
  max_retries: 3
  retry_backoff_seconds: [1.0, 2.0, 4.0]
  retry_status_codes: [403, 429, 500, 502, 503, 504]

# AkShare 公共行情数据源配置
akshare:
  # 最小请求间隔（秒），避免连续请求触发东方财富反爬
  min_request_interval_seconds: 1.0
  # 失败重试次数
  max_retries: 2
  # 重试退避时间序列（秒），按序使用
  retry_backoff_seconds: [1.0, 3.0]
  # 东方财富源失败后，是否自动降级到新浪源（仅 A 股 stock 类型生效）
  fallback_enabled: true

# 告警配置（S7-007）
alerting:
  enabled: true
  channel: "dingtalk"              # dingtalk / feishu / wecom / generic
  aggregation:
    window_minutes: 60             # 聚合时间窗口（分钟）
    max_count: 100                 # 超过此数量立即发送
  dingtalk:
    webhook_url: ""                 # 填入你的钉钉群机器人 Webhook URL
    secret: ""                     # 可选，加签密钥
  feishu:
    webhook_url: ""                # 填入飞书群机器人 Webhook URL
  wecom:
    webhook_url: ""                # 填入企业微信群机器人 Webhook URL
  min_level: "WARNING"            # INFO / WARNING / CRITICAL
  console_output: true             # 是否同时打印到控制台
