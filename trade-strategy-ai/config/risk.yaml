# Risk Agent 配置

risk:
  # 头寸管理
  position_manager:
    mode: "fixed_ratio"  # fixed_amount | fixed_ratio | volatility_adjusted
    fixed_amount: 10_000.0
    fixed_ratio_pct: 0.05
    target_volatility: 0.15
    max_position_pct: 0.20
    max_single_position: 50_000.0

  # 止损
  stop_loss:
    mode: "volatility"  # fixed | volatility | trailing | time
    fixed_pct: 0.05
    atr_multiplier: 2.0
    atr_window: 14
    drawdown_pct: 0.10
    max_hold_days: 10

  # 止盈
  take_profit:
    mode: "scaling"  # fixed | scaling | trailing | time
    fixed_pct: 0.15
    scaling_levels:
      - target_pct: 0.05
        close_pct: 0.50
      - target_pct: 0.10
        close_pct: 0.30
      - target_pct: 0.20
        close_pct: 0.20
    trailing_pct: 0.05
    target_hold_days: 5

# 模拟账户
simulated_account:
  enabled: true
  initial_capital: 100_000.0
  persist_to_db: true