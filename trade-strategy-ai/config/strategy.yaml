# Strategy Agent 配置
strategy:
  # 特征计算
  feature_engine:
    mode: "realtime"  # realtime | precomputed
    compute_batch: true

  # 规则评估
  rule_evaluator:
    dsl_executor:
      mode: "all"  # all | first | best
      timeout_ms: 100

  # 信号合成
  signal_synthesizer:
    mode: "priority"  # weighted_score | voting | priority
    weights:
      entry: 1.0
      exit: 1.2
      filter: 1.5
      sizing: 1.0
      risk: 2.0
    priorities:
      - risk
      - filter
      - exit
      - sizing
      - entry
